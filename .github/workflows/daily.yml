name: Daily run

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC, after most overnight publications
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Observations live on the orphan `data` branch, checked out into data/.
      - uses: actions/checkout@v4
        id: data
        continue-on-error: true
        with:
          ref: data
          path: data

      - name: Initialise the data branch if it does not exist yet
        if: steps.data.outcome == 'failure'
        run: |
          rm -rf data && mkdir data && cd data
          git init --initial-branch data
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the checks
        run: uv run sourcewatch --log-level INFO run --data-dir data
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

      - name: Commit the observations
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: run $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin data 2>/dev/null || true
            git push origin HEAD:data
          fi

      - name: Render the site
        run: uv run sourcewatch site --data-dir data --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
